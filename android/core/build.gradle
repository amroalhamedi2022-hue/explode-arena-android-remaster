plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    api 'com.badlogicgames.gdx:gdx:1.14.2'
    testImplementation 'junit:junit:4.13.2'
}

test { useJUnit() }
