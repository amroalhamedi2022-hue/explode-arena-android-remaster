name: Native Kotlin/libGDX source checks (no APK)

on:
  pull_request:
    paths:
      - 'android/**'
      - 'docs/**'
      - 'README_AR.md'
      - '.github/workflows/native-kotlin-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explode-native-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-source-check:
    # Source and JVM unit tests ONLY. Do not assemble, package or upload an APK.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test native Kotlin core without Android packaging
        run: gradle --project-dir android :core:test --stacktrace --no-daemon
