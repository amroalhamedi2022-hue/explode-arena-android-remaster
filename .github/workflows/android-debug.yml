name: Build private Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

concurrency:
  group: explodearena-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    # Original Symbian game resources are included; never build in a public repo.
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the PRIVATE repository
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify preinstalled Android SDK
        run: |
          test -n "$ANDROID_SDK_ROOT"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android SDK platform and build tools
        run: "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run deterministic gameplay tests
        run: |
          node --check web/core.js
          node --check web/world.js
          node --check web/game.js
          node tests/test_core.js
          node tests/test_world.js
          node tests/test_duel.js
          node tests/test_bot.js
          node tests/test_all_arenas.js
      - name: Synchronize app assets with game source
        run: |
          python tools/sync_android.py
          python tests/test_data.py
          python tests/test_android_config.py
      - name: Compile actual debug APK
        run: gradle --no-daemon --project-dir android :app:assembleDebug --stacktrace
      - name: Validate ZIP structure and debug signature
        run: |
          python tools/verify_apk.py android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --min-sdk-version 26 --verbose android/app/build/outputs/apk/debug/app-debug.apk
      - name: Write APK checksum
        shell: bash
        run: |
          cd android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          {
            echo '### Private Explode Arena Android debug build'
            echo 'APK: `app-debug.apk`'
            echo 'SHA-256:'
            echo '```'
            cat app-debug.apk.sha256
            echo '```'
            echo 'Status: compiled and signature verified by the CI job; **not yet tested on a physical Android device**.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload private debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ExplodeArena-private-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
